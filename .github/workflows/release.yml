name: Release extension package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install test dependencies
        run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Verify source and browser behavior
        run: npm run verify
      - name: Check tag matches manifest
        run: python3 scripts/build-release.py --tag "$GITHUB_REF_NAME"

  release:
    needs: verify
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build extension ZIP
        shell: pwsh
        run: ./scripts/build-release.ps1

      - name: Validate release notes
        shell: pwsh
        run: ./scripts/build-release-notes.ps1 -Tag $env:GITHUB_REF_NAME -OutputPath dist/release-notes.md

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            Get-ChildItem -LiteralPath dist -File |
              Where-Object { $_.Name -match '\.zip(?:\.sha256)?$' } |
              ForEach-Object FullName
          )
          if ($assets.Count -ne 2) {
            throw "Expected one ZIP and one ZIP checksum, found $($assets.Count) assets"
          }
          gh release create $env:GITHUB_REF_NAME @assets --verify-tag --notes-file dist/release-notes.md
